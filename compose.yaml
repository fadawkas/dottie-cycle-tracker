x-api-build: &api-build ./api

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh db/dev-env.sh to generate .env}
      TRACKER_DB_PASSWORD: ${TRACKER_DB_PASSWORD:?Run sh db/dev-env.sh to generate .env}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db/init-role.sh:/docker-entrypoint-initdb.d/01-tracker-role.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "tracker_owner", "-d", "tracker"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: *api-build
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://tracker_owner:${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}@db:5432/tracker
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *api-build
    environment:
      DATABASE_URL: postgresql://tracker_app:${TRACKER_DB_PASSWORD:?Missing TRACKER_DB_PASSWORD}@db:5432/tracker
      APP_ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Missing BETTER_AUTH_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/src
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./api/package-lock.json

  web:
    build: ./web
    environment:
      API_TARGET: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/package-lock.json

volumes:
  postgres:
